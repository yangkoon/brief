name: Telegram Brief Notify

on:
  # brief.yangkoon.com/admin 의 '텔레그램 발송' 버튼(또는 GitHub Actions 수동 실행)으로만 발송.
  # git push 시 검토중(비공개) 호가 의도치 않게 자동 발송되지 않도록 push 트리거는 비활성화함.
  workflow_dispatch:
    inputs:
      target_file:
        description: '발송할 브리프 (예: AEC_Brief_03.html, AI+_Brief_03.html, latest-aec, latest-ai)'
        required: false
        default: 'latest-aec'
        type: string
      edit_message_id:
        description: '기존 채널 메시지 수정 시 message_id 입력 (비워두면 새 메시지 발송)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  notify-telegram:
    name: Send Brief to Telegram Channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Telegram channel post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AEC_TELEGRAM_BOT_TOKEN: ${{ secrets.AEC_TELEGRAM_BOT_TOKEN }}
          AEC_TELEGRAM_CHAT_ID: ${{ secrets.AEC_TELEGRAM_CHAT_ID }}
          AI_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_TELEGRAM_BOT_TOKEN }}
          AI_TELEGRAM_CHAT_ID: ${{ secrets.AI_TELEGRAM_CHAT_ID }}
          INPUT_FILE: ${{ inputs.target_file }}
          EDIT_MSG_ID: ${{ inputs.edit_message_id }}
        run: |
          EDIT_FLAG=()
          if [ -n "$EDIT_MSG_ID" ]; then
            EDIT_FLAG=(--edit-message-id "$EDIT_MSG_ID")
          fi
          python3 .github/scripts/send_telegram_brief.py --wait-for-live "${EDIT_FLAG[@]}" "${INPUT_FILE:-latest-aec}"
