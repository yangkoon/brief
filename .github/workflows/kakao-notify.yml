name: KakaoTalk Brief Notify

on:
  push:
    branches:
      - main
    paths:
      - '*_Brief_*.html'

  workflow_dispatch:
    inputs:
      target_file:
        description: '발송할 브리프 파일명 (예: AI+_Brief_02.html / latest 입력 시 최신 호 발송)'
        required: false
        default: 'latest'
        type: string

  # 매월 1일·15일 10:00 KST — GH_SECRET_PAT 설정 시 카카오 Refresh Token(60일 만료) 자동 연장
  schedule:
    - cron: '0 1 1,15 * *'

permissions:
  contents: write

jobs:
  notify-kakao:
    name: Send Brief to KakaoTalk (나에게 보내기)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect newly published brief files
        id: detect
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE_REF="HEAD~1"
          else
            BASE_REF="$BEFORE_SHA"
          fi

          # 기본은 신규 추가(--diff-filter=A)된 브리프만 발송.
          # 단, 커밋 메시지에 [발송] 또는 [kakao]가 포함되면 수정본(AM)도 재발송 및 화면 재캡처.
          if echo "$COMMIT_MSG" | grep -Eq '\[(발송|kakao|KAKAO)\]'; then
            FILTER="AM"
            echo "force_thumbs=true" >> "$GITHUB_OUTPUT"
          else
            FILTER="A"
            echo "force_thumbs=false" >> "$GITHUB_OUTPUT"
          fi

          FILES=$(git diff --name-only --diff-filter="$FILTER" "$BASE_REF" "$AFTER_SHA" -- '*_Brief_*.html' | tr '\n' ' ' | xargs)
          echo "Detected files ($FILTER): ${FILES:-<none>}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Render & push brief screen image (Push)
        if: github.event_name == 'push' && steps.detect.outputs.files != ''
        env:
          TARGET_FILES: ${{ steps.detect.outputs.files }}
          FORCE_THUMBS: ${{ steps.detect.outputs.force_thumbs }}
        run: |
          EXTRA_FLAG=""
          if [ "$FORCE_THUMBS" = "true" ]; then
            EXTRA_FLAG="--force-thumbs"
          fi
          # shellcheck disable=SC2086
          python3 .github/scripts/send_kakao_brief.py --generate-thumbs $EXTRA_FLAG $TARGET_FILES
          if [ -n "$(git status --porcelain thumbs/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thumbs/
            git commit -m "Generate brief screen thumbnail [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Send KakaoTalk message (Push)
        id: send_push
        if: github.event_name == 'push' && steps.detect.outputs.files != ''
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRET_PAT: ${{ secrets.GH_SECRET_PAT }}
          TARGET_FILES: ${{ steps.detect.outputs.files }}
        run: |
          # shellcheck disable=SC2086
          python3 .github/scripts/send_kakao_brief.py --wait-for-live $TARGET_FILES

      - name: Render & Send KakaoTalk message (Manual Test / Dispatch)
        id: send_manual
        if: github.event_name == 'workflow_dispatch'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRET_PAT: ${{ secrets.GH_SECRET_PAT }}
          INPUT_FILE: ${{ inputs.target_file }}
        run: |
          python3 .github/scripts/send_kakao_brief.py --generate-thumbs "${INPUT_FILE:-latest}"
          if [ -n "$(git status --porcelain thumbs/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thumbs/
            git commit -m "Generate brief screen thumbnail [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          python3 .github/scripts/send_kakao_brief.py --wait-for-live "${INPUT_FILE:-latest}"

      - name: Periodic Refresh Token Keep-Alive
        id: send_schedule
        if: github.event_name == 'schedule'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRET_PAT: ${{ secrets.GH_SECRET_PAT }}
        run: |
          if [ -z "$GH_SECRET_PAT" ]; then
            echo "GH_SECRET_PAT 미설정 상태이므로 정기 토큰 자동 저장 단계를 건너뜁니다."
            exit 0
          fi
          python3 .github/scripts/send_kakao_brief.py --refresh-only

      - name: Auto-update KAKAO_REFRESH_TOKEN secret when rotated
        if: >-
          always() &&
          (steps.send_push.outputs.token_rotated == 'true' ||
           steps.send_manual.outputs.token_rotated == 'true' ||
           steps.send_schedule.outputs.token_rotated == 'true')
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_PAT }}
          NEW_TOKEN: ${{ steps.send_push.outputs.new_refresh_token || steps.send_manual.outputs.new_refresh_token || steps.send_schedule.outputs.new_refresh_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::카카오 Refresh Token이 갱신 시점(만료 30일 이내)에 도달했습니다. 영구 자동 갱신을 원하시면 GH_SECRET_PAT 시크릿을 추가하거나 수동으로 KAKAO_REFRESH_TOKEN을 갱신해 주세요."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --body "$NEW_TOKEN" -R "${{ github.repository }}"
          echo "✅ GitHub Secret(KAKAO_REFRESH_TOKEN) 자동 갱신 완료"
